services:
  kf-mcp:
    build: .
    image: kf-mcp:latest
    container_name: kf-mcp
    restart: unless-stopped
    ports:
      # Published on all interfaces by default. The server has no authentication, so
      # if nginx (or another proxy) fronts it, set KF_BIND=127.0.0.1 to make it
      # unreachable directly from the network.
      - "${KF_BIND:-0.0.0.0}:8001:8001"
    volumes:
      # Where kf.db and its vectors live on the host; must be writable by the
      # user running compose, since embed_db.py writes the index into it.
      - ${KF_DATA_DIR:-/home/dh/kf_data}:/data
    environment:
      - PYTHONUNBUFFERED=1
      # The server answers on its *public* path so nginx can proxy_pass without
      # rewriting. Change this together with the nginx location block; the two
      # must agree exactly or every request 404s.
      - KF_HTTP_PATH=${KF_HTTP_PATH:-/mcp/kf/mcp}
      # Semantic search. The key is only needed to embed incoming queries — the
      # passage vectors are already in kf.db. GPUStack is reachable from inside
      # the UniBE network only.
      - GPUSTACK_BASE_URL=${GPUSTACK_BASE_URL:-https://gpustack.unibe.ch/v1}
      - GPUSTACK_API_KEY=${GPUSTACK_API_KEY:-}
      - KF_EMBED_MODEL=${KF_EMBED_MODEL:-qwen3-embedding-0.6b}
    healthcheck:
      # A plain TCP connect: opening the endpoint would start an MCP session and
      # abandon it every 30 seconds.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
